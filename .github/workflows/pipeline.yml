name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: 1. Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint & Typecheck
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Unit Tests
        run: npm test

      - name: Build Next.js
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: npm run build

  deploy:
    name: 2. Deploy to Liara
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy with Liara CLI
        env:
          LIARA_APP_NAME: ${{ secrets.LIARA_APP_NAME }}
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          if [ -z "$LIARA_APP_NAME" ] || [ -z "$LIARA_API_TOKEN" ]; then
            echo "Liara secrets are not configured yet. Skipping deployment."
            exit 0
          fi
          npx @liara/cli deploy --app "$LIARA_APP_NAME" --api-token "$LIARA_API_TOKEN" --platform next --port 3000 --detach