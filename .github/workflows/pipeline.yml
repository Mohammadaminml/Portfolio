name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: 1. Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint & Typecheck
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Unit Tests
        run: npm test

      - name: Build Next.js
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: npm run build

  deploy:
    name: 2. Deploy to Windows Server
    runs-on: self-hosted
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Pull, Build & Restart PM2
        shell: powershell
        run: |
          cd C:\Users\m.molakazemiha\Portfolio
          git pull origin main
          pm2 stop portfolio
          npm ci
          npx prisma generate
          npm run build
          pm2 restart portfolio